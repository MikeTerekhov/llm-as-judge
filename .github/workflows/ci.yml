name: Research prototype CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: python -m pip install -r requirements-api.txt
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
  evaluation:
    name: Synthetic evaluation report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and verify deterministic offline report
        run: python -m scripts.verify_evaluation_ci --output artifacts/synthetic-evaluation.json
      - name: Verify fail-closed research readiness
        run: python -m scripts.verify_release_ci
      - name: Create pending research manifest
        run: python -m scripts.verify_manifest_ci
      - name: Upload verified synthetic evaluation
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-report
          path: |
            artifacts/synthetic-evaluation.json
            artifacts/release-readiness.json
            artifacts/research-release-manifest.json
          if-no-files-found: error
          retention-days: 14
  regression:
    name: Synthetic evaluation regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout baseline commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Checkout proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate baseline report
        working-directory: baseline
        run: python -m scripts.verify_evaluation_ci --output ../baseline-report.json
      - name: Generate proposed report
        working-directory: proposed
        run: python -m scripts.verify_evaluation_ci --output ../current-report.json
      - name: Compare synthetic evaluation
        working-directory: proposed
        run: python -m scripts.compare_evaluation_reports --baseline ../baseline-report.json --current ../current-report.json --output ../evaluation-regression.json
      - name: Upload regression summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-regression
          path: evaluation-regression.json
          if-no-files-found: warn
          retention-days: 14
